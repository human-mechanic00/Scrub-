<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | PT Human Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

    <div class="login-box">

        <img src="../images/logo.png" alt="Logo">

        <h2>لوحة التحكم</h2>

        <form id="loginForm">

    <input id="email" name="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>

    <input id="password" name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>


    <div class="remember-me">

        <label>

            <input type="checkbox">

            تذكرني

        </label>

    </div>


    <button type="submit">

        <i class="fa-solid fa-right-to-bracket"></i>

        تسجيل الدخول

    </button>


    <p class="login-note">

        هذه الصفحة مخصصة لإدارة المتجر فقط.

    </p>



        </form>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>

</body>

</html>
