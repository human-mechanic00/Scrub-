<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل المنتج | Human Mechanic</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/admin.css"></head><body><div class="add-product-box"><h1>تعديل المنتج</h1><form id="editProductForm"><input id="productName" placeholder="اسم المنتج" required><input id="productPrice" type="number" min="0" placeholder="السعر" required><select id="productCategory"><option>اسكرابات طبية</option><option>بلاطي</option><option>علاج طبيعي</option><option>أسنان</option><option>صيدلة</option></select><input id="productStock" type="number" min="0" placeholder="المخزون"><input id="productBadge" placeholder="شارة اختيارية"><label><input id="productFeatured" type="checkbox"> منتج مميز</label><input id="productImage" type="file" accept="image/*"><textarea id="productDescription" placeholder="وصف المنتج"></textarea><textarea id="productOptions" placeholder='خيارات المنتج JSON اختياري'></textarea><button type="submit">حفظ التعديلات</button></form></div><script src="../js/api.js"></script><script src="../js/admin.js"></script></body></html>
