<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة منتج | Human Mechanic</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/admin.css"></head><body><div class="add-product-box"><h1>إضافة منتج جديد</h1><form id="productForm"><input id="productName" name="name" placeholder="اسم المنتج" required><input id="productPrice" name="price" type="number" min="0" placeholder="السعر" required><select id="productCategory" name="category" required><option value="">اختر التصنيف</option><option>اسكرابات طبية</option><option>بلاطي</option><option>علاج طبيعي</option><option>أسنان</option><option>صيدلة</option></select><input id="productStock" name="stock" type="number" min="0" value="10" placeholder="المخزون"><input id="productBadge" name="badge" placeholder="شارة اختيارية: جديد / الأكثر مبيعًا"><label><input id="productFeatured" type="checkbox"> منتج مميز</label><input id="productImage" type="file" accept="image/*" required><textarea id="productDescription" name="description" placeholder="وصف المنتج"></textarea><textarea id="productOptions" name="options" placeholder='خيارات المنتج JSON اختياري، مثال: [{"name":"المقاس","values":["S","M","L"]}]'></textarea><button type="submit">إضافة المنتج</button></form></div><script src="../js/api.js"></script><script src="../js/admin.js"></script></body></html>
